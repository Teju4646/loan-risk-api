version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: loan-risk-db
    environment:
      POSTGRES_DB: riskdb
      POSTGRES_USER: riskuser
      POSTGRES_PASSWORD: riskpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskuser -d riskdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loan-risk-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/riskdb
      DB_USER: riskuser
      DB_PASSWORD: riskpass
      DB_DRIVER: org.postgresql.Driver
      JWT_SECRET: change-this-super-secret-key-in-prod-min-32-chars
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loan-risk-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
