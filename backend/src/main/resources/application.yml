server:
  port: 8080

spring:
  application:
    name: loan-risk-api
  datasource:
    url: ${DB_URL:jdbc:h2:mem:riskdb}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

jwt:
  secret: ${JWT_SECRET:change-this-super-secret-key-in-prod-min-32-chars}
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
